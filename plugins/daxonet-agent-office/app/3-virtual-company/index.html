<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daxonet Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="/shared/office.css">
<style>
  .files{font-size:11px; line-height:1.7; color:var(--text-bright); max-height:140px; overflow-y:auto;}
  .files .dir{color:var(--text-dim); font-size:10px; overflow-wrap:anywhere; margin-bottom:4px;}
  .err-text{font-size:11px; color:var(--red); margin-top:6px;}
</style>
</head>
<body>
<div class="titlebar">
  <h1>DAXONET STUDIO</h1>
  <span class="sub">// a virtual company that ships real code</span>
  <span class="conn" id="conn">CONNECTING…</span>
</div>

<div class="app">
  <div class="floor-wrap">
    <canvas id="floor"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>
  </div>

  <div class="hud">
    <div class="hud-section">
      <p class="hud-title">NEW PROJECT</p>
      <textarea id="idea" maxlength="1200" aria-label="Project idea">A command-line tool that converts Markdown tables to CSV, with a --delimiter option.</textarea>
      <label class="check"><input type="checkbox" id="allowRun"> Let QA run the tests on this computer (runs code the agents wrote, inside the project's workspace folder)</label>
      <div class="cmd-row"><button class="btn" id="startBtn" type="button">BUILD IT</button></div>
      <div class="err-text" id="startErr" hidden></div>
    </div>

    <div class="hud-section">
      <p class="hud-title">PIPELINE</p>
      <div class="phases" id="phases"></div>
      <div class="stat-row" style="margin-top:8px;"><span>Model</span><b id="stModel">-</b></div>
      <div class="stat-row"><span>Claude calls</span><b id="stCalls">0</b></div>
      <div class="stat-row"><span>Tokens in / out</span><b id="stTokens">0 / 0</b></div>
      <div class="stat-row"><span>Est. spend</span><b id="stCost">-</b></div>
    </div>

    <div class="hud-section">
      <p class="hud-title">DELIVERABLES</p>
      <div class="files" id="files"><div class="dir">Nothing built yet.</div></div>
    </div>

    <div class="hud-section">
      <p class="hud-title">SELECTED</p>
      <div id="detail" class="selected-info"></div>
    </div>

    <div class="hud-section" style="border-bottom:none; padding-bottom:0;">
      <p class="hud-title">TEAM</p>
    </div>
    <div class="roster" id="roster"></div>

    <div class="log-wrap">
      <p class="hud-title" style="margin-bottom:8px;">PROJECT LOG</p>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<script type="module">
  import { createOffice, createHud, connectEvents, escapeHtml } from "/shared/office.js";

  const office = createOffice({
    canvas: document.getElementById("floor"),
    brand: "DAXONET",
    rooms: {
      DESK_A:  { label:"QA LAB",      tint:"#00fff2", desk:"dual" },
      DESK_B:  { label:"ENGINEERING", tint:"#ff2ec4", desk:"dual" },
      DESK_C:  { label:"EXEC SUITE",  tint:"#ffb000", desk:"dual" },
      MEETING: { label:"WAR ROOM",    tint:"#7c9bff" }
    },
    onSelect: () => hud.refresh()
  });
  const hud = createHud({
    office,
    rosterEl: document.getElementById("roster"),
    logEl: document.getElementById("log"),
    detailEl: document.getElementById("detail")
  });

  const startBtn = document.getElementById("startBtn");
  const conn = document.getElementById("conn");
  const nf = n => n.toLocaleString();
  connectEvents({
    office, hud,
    onStatus: on => { conn.dataset.on = on; conn.textContent = on ? "LIVE" : "OFFLINE - start the server"; },
    onEvent: e => {
      if (e.type === "phases"){
        document.getElementById("phases").innerHTML = e.phases.map(p => `<span class="phase" data-s="${p.state}">${escapeHtml(p.name)}</span>`).join("");
      } else if (e.type === "files"){
        const el = document.getElementById("files");
        el.innerHTML = e.dir
          ? `<div class="dir">${escapeHtml(e.dir)}</div>` + (e.files.map(f => `<div>${escapeHtml(f)}</div>`).join("") || "<div class='dir'>empty</div>")
          : `<div class="dir">Nothing built yet.</div>`;
      } else if (e.type === "status"){
        startBtn.disabled = e.running;
        startBtn.textContent = e.running ? "BUILDING…" : "BUILD IT";
        document.getElementById("stModel").textContent = e.model;
        document.getElementById("stCalls").textContent = nf(e.calls);
        document.getElementById("stTokens").textContent = `${nf(e.input)} / ${nf(e.output)}`;
        document.getElementById("stCost").textContent = e.cost == null ? "unknown model" : "$" + e.cost.toFixed(3);
      }
    }
  });

  startBtn.addEventListener("click", async () => {
    const err = document.getElementById("startErr");
    err.hidden = true;
    const res = await fetch("/start", { method:"POST", headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ idea:document.getElementById("idea").value, allowRun:document.getElementById("allowRun").checked }) });
    const out = await res.json().catch(() => ({ ok:false, error:"Server did not respond." }));
    if (!out.ok){ err.hidden = false; err.textContent = out.error || "Could not start."; }
  });
</script>
</body>
</html>
